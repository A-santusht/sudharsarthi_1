[build]
  publish = "."

# Netlify: Proxy /api and /uploads to live serverless Vercel backend
[[redirects]]
  from = "/api/*"
  to = "https://sudharsarthi.vercel.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://sudharsarthi.vercel.app/uploads/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
