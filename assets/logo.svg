<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="SUDHARSARTHI Gen-Z Logo">
  <defs>
    <linearGradient id="gz-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="gz-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="35%" stop-color="#8b5cf6"/>
      <stop offset="70%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="gz-road" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gz-bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="gz-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Cyber Neon Border -->
  <rect x="6" y="6" width="148" height="148" rx="36" fill="url(#gz-bg)" stroke="url(#gz-neon)" stroke-width="4.5" />
  
  <!-- Cyber Grid Lines -->
  <path d="M 6 54 H 154 M 6 106 H 154 M 54 6 V 154 M 106 6 V 154" stroke="#00f5ff" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Outer Holographic Diamond Aura -->
  <polygon points="80,24 136,80 80,136 24,80" fill="none" stroke="url(#gz-neon)" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Futuristic Cyber Road / Hyperloop Track -->
  <path d="M 40 134 L 72 68 L 88 68 L 120 134 Z" fill="url(#gz-road)" opacity="0.85" />
  
  <!-- Center Neon Road Dashes -->
  <line x1="80" y1="130" x2="80" y2="72" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="8 8" />

  <!-- Gen-Z Electric Lightning Bolt (Instant AI Defect Fix) -->
  <polygon points="84,18 58,74 76,74 70,122 104,64 86,64" fill="url(#gz-bolt)" filter="url(#gz-glow)" stroke="#ffffff" stroke-width="1.5" />

  <!-- Cyber Sparkles ✦ -->
  <path d="M 124 38 Q 124 48 134 48 Q 124 48 124 58 Q 124 48 114 48 Q 124 48 124 38 Z" fill="#00f5ff" />
  <path d="M 32 108 Q 32 114 38 114 Q 32 114 32 120 Q 32 114 26 114 Q 32 114 32 108 Z" fill="#ec4899" />
  <circle cx="128" cy="118" r="3.5" fill="#10b981" />
</svg>
